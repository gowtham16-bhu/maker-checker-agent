[project]
name = "maker-checker-agent"
version = "0.1.0"
description = "Maker-checker (separation of duties) for AI agents: the LLM proposes, code approves."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=2.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["maker_checker"]
