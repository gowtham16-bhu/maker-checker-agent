[project]
name = "maker-checker"
version = "0.2.0"
description = "Framework-agnostic policy gate for AI agent tool calls: the LLM proposes, plain code approves."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
keywords = ["ai-agents", "llm", "security", "prompt-injection", "guardrails", "policy"]

[project.scripts]
maker-checker = "maker_checker.cli:main"

[project.urls]
Homepage = "https://github.com/gowtham16-bhu/maker-checker-agent"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["maker_checker"]
